# Exact DEV-only BizPortal issuer route for Customer Portal Invoice.
# Template only: NOT auto-included, NOT a live Nginx change.
# Review after deploying the pinned Draft candidate to existing DEV API
# 127.0.0.1:19784, then insert into the HTTPS:443 server block for
# bizportal-dev.cstlogistic.co.id.
# Never add to a PROD domain or activate the issuer flag in PROD.
#
# The original BizPortal API independently validates its signed Super Admin
# cookie and emits Ed25519 evidence bound to the Portal's Invoice challenge.
# Browser top-level popup navigation uses its original SameSite=Lax cookie.
# No secrets or issuer private keys cross the application boundary.
# The backend dynamic-nonce Content-Security-Policy must pass through.
# No Access-Control-Allow-Origin wildcard or second login route.

location = /api/auth/dev/customer-invoice-attestation {
    limit_except GET { deny all; }

    proxy_pass http://127.0.0.1:19784;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;

    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

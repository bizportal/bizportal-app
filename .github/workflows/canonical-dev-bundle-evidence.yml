name: Canonical DEV Bundle Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/canonical-dev-bundle-evidence.yml

permissions:
  contents: read

concurrency:
  group: canonical-dev-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and upload isolated canonical bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: development
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
      SUPABASE_DATABASE_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
      SUPABASE_PG_URL: postgresql://ci:ci@127.0.0.1:65432/ci
      SUPABASE_DATABASE_URL: ""
      PAYROLL_DATABASE_URL_PROD: ""
      GCP_SECRET_MANAGER_BOOTSTRAP_JSON: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8331aae4a0027cc3516aa26085fed327b55774b9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/canonical-dev-bundle-evidence.yml"
          echo "CANONICAL_SOURCE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated release bundle
        run: pnpm run build
      - name: Verify release contents and create fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.mjs
          test -s dist/index.js
          test -s dist/public/index.html
          ! find dist -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) | grep -q .
          mkdir -p release-verification
          printf 'source_sha=%s\n' "$CANONICAL_SOURCE_SHA" > release-verification/provenance.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > release-verification/files.sha256
          tar -czf release-verification/canonical-dev-bundle.tar.gz -C . dist
          sha256sum release-verification/canonical-dev-bundle.tar.gz > release-verification/archive.sha256
          echo "BUNDLE_FILES=$(find dist -type f | wc -l)"
          cat release-verification/archive.sha256
      - name: Upload evidence artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: canonical-dev-bundle-evidence
          path: release-verification/
          retention-days: 3
          if-no-files-found: error

name: PR81 Canonical Finance Service Disposable PG16
on:
  pull_request:
    branches: [main, develop, test/finance-pr79-pr80-integration-20261115]
    paths:
      - 'scripts/tests/pr81-real-writer-*'
      - 'scripts/tests/pr81-build-real-writer-disposable.cjs'
      - 'scripts/tests/pr81-run-real-writer-disposable.sh'
      - 'scripts/tests/README-pr81-canonical-service-disposable.md'
      - 'artifacts/api-server/src/lib/services/mktApPreparationService.ts'
      - '.github/workflows/pr81-canonical-service-disposable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-finance-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen source dependencies (no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Make canonical schema module resolvable to the isolated test bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d artifacts/api-server/node_modules
          test -e lib/db/node_modules/drizzle-zod
          if test ! -e artifacts/api-server/node_modules/drizzle-zod; then
            ln -s ../../../lib/db/node_modules/drizzle-zod artifacts/api-server/node_modules/drizzle-zod
          fi
          test -e artifacts/api-server/node_modules/drizzle-zod
      - name: Bundle the UNMODIFIED canonical AP and Accounting service
        run: node scripts/tests/pr81-build-real-writer-disposable.cjs
      - name: Execute service on isolated PostgreSQL 16 and prove ROLLBACK
        shell: bash
        run: bash scripts/tests/pr81-run-real-writer-disposable.sh
      - name: Check service code and lockfile remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- artifacts/api-server/src/lib/services/mktApPreparationService.ts lib/db/src/schema pnpm-lock.yaml

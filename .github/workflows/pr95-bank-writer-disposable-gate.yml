name: PR95 Bank Writer Disposable Contract Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "scripts/tests/pr95_bank_payment_atomic_contract.sql"
      - "scripts/tests/pr95_bank_source_journal_guard_disposable.sql"
      - "artifacts/api-server/src/lib/bankDisbursementAtomicBoundary.ts"
      - "artifacts/api-server/src/lib/bankDisbursementAtomicBoundary.postgres.test.ts"
      - "artifacts/api-server/src/lib/outboundReuseFinalityReader.ts"
      - "artifacts/api-server/src/__tests__/pr95-outbound-reuse-finality-postgres.test.ts"
      - "artifacts/api-server/src/lib/outboundReuseTransactionScope.ts"
      - "artifacts/api-server/src/__tests__/pr95-outbound-reuse-lock-postgres.test.ts"
      - "artifacts/api-server/src/lib/outboundReuseBankCoaGate.ts"
      - "artifacts/api-server/src/__tests__/pr95-outbound-bank-coa-postgres.test.ts"
      - "artifacts/api-server/src/lib/outboundSourceReuseCandidate.ts"
      - "artifacts/api-server/src/__tests__/pr95-outbound-source-reuse-candidate-postgres.test.ts"
      - "artifacts/api-server/src/lib/outboundSourceReuseDevAuth.ts"
      - "artifacts/api-server/src/lib/outboundSourceReuseDevBridge.ts"
      - "artifacts/api-server/src/__tests__/pr95-outbound-dev-superadmin-gate.test.ts"
      - "artifacts/api-server/src/__tests__/pr95-outbound-dev-bridge-contract.test.ts"
      - ".github/workflows/pr95-bank-writer-disposable-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-boundary-postgres:
    name: Real PG transaction adapter (NOT live writer)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres.xssrfshdrtdfupgqwfdw
          POSTGRES_PASSWORD: ci_only_disposable
          POSTGRES_DB: pr95_ci
        ports:
          - 65433:5432
        options: >-
          --health-cmd "pg_isready -U postgres.xssrfshdrtdfupgqwfdw -d pr95_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: development
      NODE_ENV: test
      PR95_ATOMIC_PG_URL: postgresql://postgres.xssrfshdrtdfupgqwfdw:ci_only_disposable@127.0.0.1:65433/pr95_ci
      SUPABASE_DATABASE_URL_DEV: postgresql://postgres.xssrfshdrtdfupgqwfdw:ci_only_disposable@127.0.0.1:65433/pr95_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run candidate boundary through real isolated PG transactions
        run: pnpm --filter @workspace/api-server exec vitest run src/lib/bankDisbursementAtomicBoundary.postgres.test.ts src/__tests__/pr95-outbound-reuse-finality-postgres.test.ts src/__tests__/pr95-outbound-reuse-lock-postgres.test.ts src/__tests__/pr95-outbound-bank-coa-postgres.test.ts src/__tests__/pr95-outbound-source-reuse-candidate-postgres.test.ts src/__tests__/pr95-outbound-dev-superadmin-gate.test.ts src/__tests__/pr95-outbound-dev-bridge-contract.test.ts --maxWorkers=1 --no-file-parallelism
  atomic-contract:
    name: Isolated bank payment invariants (not legacy writer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start network-isolated PostgreSQL 16
        run: |
          docker run -d --rm --name pr95-finance-disposable \
            --network none --memory 256m --cpus 0.5 \
            --tmpfs /var/lib/postgresql/data:rw,size=160m \
            -e POSTGRES_PASSWORD=ci_disposable_only postgres:16-alpine
      - name: Wait for ephemeral database
        run: |
          for attempt in $(seq 1 30); do
            if docker exec pr95-finance-disposable pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify journal, WHT, replay, scope and failure rollback
        run: |
          docker exec -i pr95-finance-disposable \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < scripts/tests/pr95_bank_payment_atomic_contract.sql
      - name: Verify source-journal duplicate hold on disposable PostgreSQL
        run: |
          docker exec -i pr95-finance-disposable \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < scripts/tests/pr95_bank_source_journal_guard_disposable.sql
      - name: Concurrent overpayment guard and one-journal invariant
        shell: bash
        run: |
          set -euo pipefail
          (docker exec -i pr95-finance-disposable psql -v ON_ERROR_STOP=1 -U postgres -d postgres -At <<'SQL_A'
          BEGIN;
          SELECT id FROM pr95_atomic.invoices WHERE id=3 FOR UPDATE;
          SELECT pg_sleep(2);
          SELECT pr95_atomic.pay(1,3,'RACE-A',80,8);
          COMMIT;
          SQL_A
          ) > /tmp/pr95-race-a.log 2>&1 &
          first=$!
          sleep 0.3
          (docker exec -i pr95-finance-disposable psql -v ON_ERROR_STOP=1 -U postgres -d postgres -At <<'SQL_B'
          SELECT pr95_atomic.pay(1,3,'RACE-B',80,8);
          SQL_B
          ) > /tmp/pr95-race-b.log 2>&1 &
          second=$!
          wait "$first"
          wait "$second"
          cat /tmp/pr95-race-a.log /tmp/pr95-race-b.log
          grep -qx 'CREATED' /tmp/pr95-race-a.log
          grep -qx 'INVALID_OR_OVERPAY' /tmp/pr95-race-b.log
          actual=$(docker exec pr95-finance-disposable psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc \
            "SELECT paid,(SELECT count(*) FROM pr95_atomic.journals WHERE invoice_id=3),(SELECT count(*) FROM pr95_atomic.disbursements WHERE invoice_id=3) FROM pr95_atomic.invoices WHERE id=3")
          test "$actual" = '80.00|1|1'
          echo 'PASS: one journal, one disbursement; second concurrent payment rejected'
      - name: Concurrent exact-key replay must create only one payment
        shell: bash
        run: |
          set -euo pipefail
          (docker exec -i pr95-finance-disposable psql -v ON_ERROR_STOP=1 -U postgres -d postgres -At <<'SQL_A'
          BEGIN;
          SELECT id FROM pr95_atomic.invoices WHERE id=4 FOR UPDATE;
          SELECT pg_sleep(2);
          SELECT pr95_atomic.pay(1,4,'SAME-KEY',40,4);
          COMMIT;
          SQL_A
          ) > /tmp/pr95-same-a.log 2>&1 &
          first=$!
          sleep 0.3
          (docker exec -i pr95-finance-disposable psql -v ON_ERROR_STOP=1 -U postgres -d postgres -At <<'SQL_B'
          SELECT pr95_atomic.pay(1,4,'SAME-KEY',40,4);
          SQL_B
          ) > /tmp/pr95-same-b.log 2>&1 &
          second=$!
          wait "$first"
          wait "$second"
          cat /tmp/pr95-same-a.log /tmp/pr95-same-b.log
          grep -qx 'CREATED' /tmp/pr95-same-a.log
          grep -qx 'REPLAY' /tmp/pr95-same-b.log
          actual=$(docker exec pr95-finance-disposable psql -v ON_ERROR_STOP=1 -U postgres -d postgres -Atc \
            "SELECT paid,(SELECT count(*) FROM pr95_atomic.journals WHERE invoice_id=4),(SELECT count(*) FROM pr95_atomic.disbursements WHERE invoice_id=4) FROM pr95_atomic.invoices WHERE id=4")
          test "$actual" = '40.00|1|1'
          echo 'PASS: identical concurrent key gets one payment; second is replay'
      - name: Destroy disposable database
        if: always()
        run: |
          docker stop pr95-finance-disposable 2>/dev/null || true
          ! docker inspect pr95-finance-disposable >/dev/null 2>&1

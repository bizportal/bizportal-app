name: Release Gate

on:
  # Run full CI once for a feature PR; do not duplicate on every feature push.
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DATABASE_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
      SUPABASE_PG_URL: postgresql://ci:ci@127.0.0.1:65432/ci
      APP_ENV: development
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      cash-qa:
        image: postgres:17
        env:
          POSTGRES_USER: cash_qa
          POSTGRES_PASSWORD: cash_qa_ci_only
          POSTGRES_DB: cash_qa
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cash_qa -d cash_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only source-only Invoice tests require the exact deployed public Portal verifier.
      # Without these files (default main), there is no extra checkout.
      - name: Checkout exact CST-DEV Customer Portal verifier for Invoice contract tests
        if: ${{ hashFiles('artifacts/api-server/src/routes/dev-customer-invoice-handoff-crossrepo.test.ts') != '' }}
        uses: actions/checkout@v4
        with:
          repository: Travelintrips/CST-CUSTOMER-PORTAL
          ref: e81fbd92ae485caa054dd9c0d433c9336dc3bc74
          path: vendor/customer-portal
          persist-credentials: false

      - name: Require unchanged pinned Portal verifier source
        if: ${{ hashFiles('artifacts/api-server/src/routes/dev-customer-invoice-handoff-crossrepo.test.ts') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/customer-portal rev-parse HEAD)" = e81fbd92ae485caa054dd9c0d433c9336dc3bc74
          test -f vendor/customer-portal/server/dev-bizportal-invoice-attestation.mjs
          test -f vendor/customer-portal/server/dev-invoice-owner-handoff.mjs
          test -f vendor/customer-portal/server/dev-invoice-owner-review-snapshot.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Finance real-PG suites require dedicated localhost Docker databases.
      # Run general API coverage without those seven files, then test them
      # against fresh disposable containers in the next step (never Supabase).
      - name: API tests
        shell: bash
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            --exclude '**/dev-finance-approval-qa.test.ts' \
            --exclude '**/dev-finance-po14-e2e-qa.test.ts' \
            --exclude '**/marketplaceBankIngestionRealPg.test.ts' \
            --exclude '**/marketplaceInvoiceApRealPg.test.ts' \
            --exclude '**/marketplacePaymentApproval.test.ts' \
            --exclude '**/marketplaceInvoiceBankStatusAdapter.test.ts' \
            --exclude '**/marketplacePaymentFinalization.test.ts'

      - name: Finance canonical SQL on disposable localhost PostgreSQL
        if: ${{ hashFiles('scripts/qa/run-po14-isolated-marketplace-e2e.sh') != '' }}
        shell: bash
        run: bash scripts/qa/run-po14-isolated-marketplace-e2e.sh

      - name: Required disposable PostgreSQL cash ledger QA
        env:
          CASH_QA_PG_URL: postgresql://cash_qa:cash_qa_ci_only@127.0.0.1:55432/cash_qa
        run: pnpm --filter @workspace/api-server exec vitest run src/__tests__/cash-ledger-postgres-disposable.test.ts

      - name: Verify scoped DEV kasbon general list on isolated PostgreSQL 16
        shell: bash
        run: bash scripts/dev/test-dev-kasbon-general-read-pg16.sh

      - name: BizPortal tests
        run: pnpm --filter @workspace/bizportal test

      - name: Verify Super Admin landing and preserve auth guard
        run: node --test scripts/dev/superadmin-login-landing.test.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Production runtime smoke
        shell: bash
        env:
          NODE_ENV: production
          APP_ENV: production
          PORT: "3000"
          SUPABASE_DATABASE_URL: postgresql://postgres.nzdweipzckfszczzqtuw:ci@127.0.0.1:65432/ci
          SUPABASE_DATABASE_URL_DEV: ""
          SUPABASE_PG_URL: ""
          GCP_SECRET_MANAGER_BOOTSTRAP_JSON: ""
        run: |
          set -euo pipefail
          test -f ./index.js
          test -f ./dist/index.js
          test -f ./dist/index.mjs
          node --max-http-header-size=65536 --enable-source-maps ./index.js > /tmp/bizportal-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/bizportal-runtime.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/api/health/live | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/bizportal-runtime.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/ >/dev/null

          # Assert that Payroll routes are mounted in the actual build.
          # Unauthenticated requests must fail at the Payroll authorization
          # middleware (401) instead of falling into the generic 404 route.
          for route in '/api/payroll/runs?companyId=1' '/api/payroll/capabilities?companyId=1'; do
            code=$(curl -sS -o /tmp/payroll-route-check.json -w '%{http_code}' "http://127.0.0.1:3000$route")
            if [ "$code" != "401" ] || ! grep -q 'Sesi tidak tersedia' /tmp/payroll-route-check.json; then
              echo "PAYROLL_ROUTE_NOT_MOUNTED route=$route status=$code"
              cat /tmp/payroll-route-check.json
              exit 1
            fi
          done
          echo PAYROLL_RUNTIME_ROUTE_PASS
          cat /tmp/bizportal-runtime.log

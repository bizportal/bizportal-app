name: Payroll Disposable PostgreSQL HTTP Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'artifacts/api-server/src/routes/payroll*'
      - '.github/workflows/payroll-postgres-http-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payroll-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-postgres:
    name: Draft HTTP / real disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres.xssrfshdrtdfupgqwfdw
          POSTGRES_PASSWORD: ci_only_disposable
          POSTGRES_DB: payroll_ci
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres.xssrfshdrtdfupgqwfdw -d payroll_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: development
      NODE_ENV: test
      SUPABASE_DATABASE_URL_DEV: postgresql://postgres.xssrfshdrtdfupgqwfdw:ci_only_disposable@127.0.0.1:65432/payroll_ci
      PAYROLL_PG_E2E_URL: postgresql://postgres.xssrfshdrtdfupgqwfdw:ci_only_disposable@127.0.0.1:65432/payroll_ci
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run real PostgreSQL Draft HTTP test
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/payroll-draft-postgres-http.test.ts
      - name: Real PostgreSQL isolated Super Admin approval HTTP (no PROD)
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/payroll-super-admin-approval-real-postgres.test.ts
      - name: Signed production login and role-scoped Super Admin approval (disposable DB only)
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/payroll-super-admin-signed-session-postgres.test.ts --maxWorkers=1 --no-file-parallelism

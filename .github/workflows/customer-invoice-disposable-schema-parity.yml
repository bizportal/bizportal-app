name: DEV Customer Invoice — disposable Accounting schema parity

on:
  pull_request:
    branches:
      - test/dev-invoice-existing-engine-transaction-adapter-20261118
    paths:
      - 'scripts/tests/customer-invoice-owner-disposable-runtime-parity.sql'
      - '.github/workflows/customer-invoice-disposable-schema-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-schema-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate schema and verify disposable-only runtime additions
        run: bash scripts/tests/customer-invoice-disposable-schema-check.sh

name: PR131 DEV Finance Pinned IPv4 Session Pooler (one GCP secret)

on:
  pull_request:
    branches:
      - test/pr130-dev-invoice-qa-ap-transaction-scope-20261117
    paths:
      - 'lib/db/src/marketplace-finance-dev.ts'
      - 'artifacts/api-server/src/routes/dev-finance-company-role-routing.test.ts'
      - '.github/workflows/pr131-pinned-company-finance-pooler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-dev-finance-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Exact source / lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict static only-company verified IPv4 pooler bridge
        shell: bash
        run: |
          set -euo pipefail
          f=lib/db/src/marketplace-finance-dev.ts
          grep -Fq 'BIZPORTAL_MARKETPLACE_FINANCE_PINNED_IPV4_SESSION_POOLER_DEV' "$f"
          grep -Fq 'aws-1-ap-southeast-2.pooler.supabase.com' "$f"
          grep -Fq 'DEV_FINANCE_IPV4_POOLER_BRIDGE_REFUSED' "$f"
          grep -Fq 'SUPABASE_FINANCE_ROOT_2021_FINGERPRINT256' "$f"
          grep -Fq 'rejectUnauthorized: true, servername: poolHost, ca' "$f"
          ! grep -Eq 'rejectUnauthorized: false|ssl: false|BYPASSRLS' "$f"
          echo PR131_FIXED_POOLER_GUARD_AND_CERT_VERIFY_PASS
      - name: No-GCP credential tests for isolated company identity and fail-closed flags
        env:
          APP_ENV: development
          NODE_ENV: test
          TZ: Asia/Jakarta
        run: |
          pnpm --dir artifacts/api-server exec vitest run \
            src/routes/dev-finance-company-role-routing.test.ts \
            src/lib/gcp-systemd-bootstrap.test.ts \
            src/routes/dev-otp-to-finance-http.test.ts
      - name: API TypeScript and full regression
        env:
          APP_ENV: development
          NODE_ENV: test
          TZ: Asia/Jakarta
        run: |
          pnpm --dir artifacts/api-server typecheck
          pnpm --dir artifacts/api-server exec vitest run --maxWorkers=2
      - name: Production API and frontend bundle (no runtime credentials)
        env:
          NODE_ENV: production
          BIZPORTAL_SIGNED_PASSWORD_ENABLED_DEV: 'true'
          BIZPORTAL_SIGNED_OTP_ENABLED_DEV: 'false'
        run: |
          pnpm --filter @workspace/api-server run build
          pnpm --filter @workspace/bizportal run build
          node scripts/prepare-hostinger.mjs
      - name: Source and lockfile clean
        run: git diff --exit-code -- lib/db/src artifacts/api-server/src pnpm-lock.yaml

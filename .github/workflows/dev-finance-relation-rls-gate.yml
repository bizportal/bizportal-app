name: DEV Finance Relationship RLS Disposable Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tests/20261115_finance_relation_rls_disposable.mjs'
      - 'scripts/sql/20261115_marketplace_finance_relation_guards_STAGED.sql'
      - '.github/workflows/dev-finance-relation-rls-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-rls-relationship:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres.xssrfshdrtdfupgqwfdw
          POSTGRES_PASSWORD: ci_finance_disposable_only
          POSTGRES_DB: payroll_ci
        ports:
          - 65432:5432
        options: >-
          --health-cmd "pg_isready -U postgres.xssrfshdrtdfupgqwfdw -d payroll_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      FINANCE_RELATION_PG_E2E_URL: postgresql://postgres.xssrfshdrtdfupgqwfdw:ci_finance_disposable_only@127.0.0.1:65432/payroll_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen repository dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify referential company policies and initial AP status
        run: node scripts/tests/20261115_finance_relation_rls_disposable.mjs

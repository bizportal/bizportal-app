name: DEV Customer Invoice — atomic exclusive PPN on original owner

on:
  pull_request:
    branches:
      - test/dev-original-owner-disposable-journal-20261118
      - test/dev-customer-invoice-atomic-ppn-20261118
    paths:
      - 'artifacts/api-server/src/lib/posting-engine/portalInvoiceAdapter.ts'
      - 'scripts/tests/customer-invoice-original-owner-synthetic-fixture.sql'
      - 'scripts/tests/customer-invoice-original-owner-disposable.mjs'
      - 'scripts/tests/customer-invoice-original-owner-disposable.sh'
      - 'scripts/tests/customer-invoice-scoped-writers.qa.sql'
      - 'scripts/tests/customer-invoice-scoped-owner.qa.mjs'
      - 'scripts/tests/customer-invoice-owner-lock*.qa.*'
      - 'scripts/tests/customer-invoice-handler-privileges.qa.*'
      - 'scripts/tests/customer-invoice-independent-approval-lock.qa.*'
      - 'scripts/sql/customer_invoice_scoped_*.sql'
      - 'scripts/tests/customer_invoice_read_b*.qa.sql'
      - 'scripts/tests/customer_invoice_lock_b3_*.qa.sql'
      - 'scripts/tests/customer_invoice_scoped_read_rls_disposable.sh'
      - 'scripts/tests/customer_invoice_b4_*.qa.*'
      - 'scripts/tests/customer_invoice_b4_*.sh'
      - 'scripts/tests/customer_invoice_scram_writer_activation.qa.mjs'
      - 'artifacts/api-server/src/lib/__tests__/portal-invoice-existing-owner-adapter.test.ts'
      - '.github/workflows/customer-invoice-atomic-ppn-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-owner-atomic-ppn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked workspace packages
        run: pnpm install --frozen-lockfile
      - name: Original owner atomic output PPN and AR E2E on synthetic DB
        run: bash scripts/tests/customer-invoice-original-owner-disposable.sh
      - name: Direct CST/Diva identity RLS and no-login B1-B3 rollback in disposable PostgreSQL16
        run: bash scripts/tests/customer_invoice_scoped_read_rls_disposable.sh
      - name: Original CanonicalPostingEngine posting via B4 scoped writer with rollback
        run: bash scripts/tests/customer_invoice_b4_original_owner_disposable.sh
      - name: Adapter and original-owner regression
        run: pnpm --dir artifacts/api-server exec vitest run src/lib/__tests__/legacy-posting-owner-transactions.test.ts src/lib/__tests__/portal-invoice-existing-owner-adapter.test.ts
      - name: Complete API typecheck
        run: pnpm --dir artifacts/api-server run typecheck

name: PR117 Canonical Vendor Invoice + PR108 Session-Bound Finance E2E

on:
  pull_request:
    branches:
      - test/pr108-session-bound-vendor-lock-20261117
      - test/pr117-vendor-service-session-lock-20261117
      - test/finance-vendor-invoice-parent-lock-contract-20261117
      - test/pr119-gcp-bootstrap-parity-20261117
      - test/pr120-single-gcp-finance-credentials-20261117
      - test/pr123-dev-finance-rls-phase1-20261117
      - develop
    paths:
      - 'artifacts/api-server/src/lib/services/mktVendorInvoiceService.ts'
      - 'artifacts/api-server/src/lib/services/mktVendorInvoiceParentLock.dev.test.ts'
      - 'artifacts/api-server/src/lib/gcp-systemd-bootstrap.test.ts'
      - 'artifacts/api-server/src/__tests__/dev-systemd-gcp-bootstrap.test.ts'
      - 'lib/db/src/gcp-database-secret.ts'
      - 'lib/db/src/marketplace-finance-dev.ts'
      - 'artifacts/api-server/src/routes/dev-finance-company-role-routing.test.ts'
      - 'scripts/tests/pr117-*'
      - 'scripts/tests/pr121-real-finance-rls-predicates-disposable.sql'
      - 'scripts/sql/20261117_pr107_*'
      - 'scripts/sql/20261117_pr108_*'
      - 'scripts/sql/20261117_pr120_live_company_finance_readonly_preflight.sql'
      - 'scripts/sql/20261117_dev_finance_*.sql'
      - 'scripts/tests/pr108-run-session-bound-definer-disposable.sh'
      - 'scripts/tests/pr123-run-company-rls-phase1-disposable.sh'
      - 'scripts/tests/finance-phase2-release-disposable.sh'
      - 'artifacts/api-server/src/lib/services/marketplaceFinanceNotifications.dev.test.ts'
      - 'artifacts/api-server/src/lib/services/marketplaceNotificationQueueService.ts'
      - '.github/workflows/pr117-canonical-vendor-finance-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-finance-service-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: [postgres:16-alpine, postgres:17-alpine]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install canonical workspace packages without changing lockfile
        run: pnpm install --frozen-lockfile
      - name: Both original PR107/108 SQL migration and rollback files must remain review-only
        shell: bash
        run: |
          set -euo pipefail
          for proposal in \
            scripts/sql/20261117_pr107_finance_company_roles_RLS_REVIEW_ONLY.sql \
            scripts/sql/20261117_pr107_finance_company_roles_ROLLBACK_REVIEW_ONLY.sql \
            scripts/sql/20261117_pr108_session_bound_vendor_lock_REVIEW_ONLY.sql \
            scripts/sql/20261117_pr108_session_bound_vendor_lock_ROLLBACK_REVIEW_ONLY.sql; do
            grep -q 'DO \$no_go\$' "$proposal"
          done
      - name: Finance live-readiness preflight remains strictly read-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('scripts/sql/20261117_pr120_live_company_finance_readonly_preflight.sql').read_text()
          stripped=re.sub(r'--[^\n]*','',source)
          assert stripped.count(';')==1, 'preflight must be one SELECT statement'
          assert re.match(r'(?is)^\s*WITH\b',stripped), 'preflight must start with CTE'
          assert re.search(r'(?is)\bSELECT\s+secured_table_count',stripped), 'preflight must return details'
          forbidden=r'(?im)^\s*(?:CREATE|ALTER|DROP|GRANT|REVOKE|INSERT|UPDATE|DELETE|TRUNCATE|DO|CALL|COPY|BEGIN|COMMIT|SET)\b'
          assert not re.search(forbidden,stripped), 'preflight must not mutate DB or role'
          assert 'f69295cc7f66f8bc4645a6fc02e2f36e' in stripped, 'baseline fingerprint missing'
          assert 'AS preflight_pass' in stripped, 'final pass predicate missing'
          print('PR120_READONLY_LIVE_PREFLIGHT_SOURCE_GUARD_PASS')
          PY
      - name: PR121 exact CST-DEV RLS snapshot must remain disposable-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('scripts/tests/pr121-real-finance-rls-predicates-disposable.sql').read_text()
          assert source.count('ALTER POLICY pr50_finance_dev_')==18
          assert 'Original source preflight MD5: f69295cc7f66f8bc4645a6fc02e2f36e' in source
          assert 'Never run on CST-DEV or PROD' in source
          assert source.count('BEGIN;')==1 and source.count('COMMIT;')==1
          assert not re.search(r'(?im)^\s*(?:CREATE ROLE|ALTER ROLE|GRANT|REVOKE|DROP ROLE|CREATE POLICY|DROP POLICY)\b',source)
          print('PR121_REAL_RLS_OVERLAY_DISPOSABLE_SOURCE_GUARD_PASS')
          PY
      - name: Build original canonical Vendor Invoice and AP/Accounting services for isolated PG
        run: node scripts/tests/pr117-build-vendor-service.cjs
      - name: Test real source services with original PR107/108 RLS and native parent row locks
        shell: bash
        env:
          PR117_DISPOSABLE_PG_IMAGE: ${{ matrix.postgres }}
        run: bash scripts/tests/pr117-run-real-vendor-finance-pg16.sh
      - name: Verify parent-lock expiry during a real authenticated lock wait
        env:
          PR108_DISPOSABLE_PG_IMAGE: ${{ matrix.postgres }}
        run: bash scripts/tests/pr108-run-session-bound-definer-disposable.sh
      - name: Verify phase0 and phase1 rejection and exact rollback
        env:
          PR123_POSTGRES_IMAGE: ${{ matrix.postgres }}
        run: bash scripts/tests/pr123-run-company-rls-phase1-disposable.sh
      - name: Verify phase2 with exact policy predicates and non-superuser admin
        env:
          FINANCE_PHASE2_PG_IMAGE: ${{ matrix.postgres }}
        run: bash scripts/tests/finance-phase2-release-disposable.sh
      - name: Existing Marketplace API and Accounting regressions
        run: |
          pnpm --dir artifacts/api-server exec vitest run \
            src/routes/mktVendorInvoice.dev-compat.test.ts \
            src/routes/dev-otp-to-finance-http.test.ts \
            src/routes/dev-finance-company-role-routing.test.ts \
            src/lib/gcp-systemd-bootstrap.test.ts \
            src/__tests__/dev-systemd-gcp-bootstrap.test.ts \
            src/lib/services/mktVendorInvoiceParentLock.dev.test.ts \
            src/lib/services/marketplaceFinanceNotifications.dev.test.ts \
            src/lib/services/mktMarketplaceCompanyScope.test.ts \
            src/routes/dev-marketplace-finance-writer.test.ts \
            src/lib/services/mktAccountingHandoff.test.ts
      - name: Canonical API + database TypeScript
        run: pnpm --dir artifacts/api-server typecheck
      - name: No tracked source or SQL modifications during integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            artifacts/api-server/src lib/db/src scripts/sql scripts/tests pnpm-lock.yaml
          test ! -e artifacts/api-server/.pr117-real-vendor-finance-service.mjs

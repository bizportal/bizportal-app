name: DEV Invoice — explicit company-owned sales tax selection

on:
  pull_request:
    branches:
      - test/dev-customer-invoice-atomic-ppn-20261118
    paths:
      - 'artifacts/api-server/src/lib/posting-engine/portalInvoiceAdapter.ts'
      - 'scripts/tests/customer-invoice-original-owner-synthetic-fixture.sql'
      - 'scripts/tests/customer-invoice-original-owner-disposable.mjs'
      - 'scripts/tests/customer-invoice-original-owner-disposable.sh'
      - '.github/workflows/customer-invoice-owned-tax-source-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-tax-source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce foreign DIVA default and accept explicitly owned 11/12 percent tax
        run: bash scripts/tests/customer-invoice-original-owner-disposable.sh
      - name: Original owner and adapter focused regressions
        run: pnpm --dir artifacts/api-server exec vitest run src/lib/__tests__/legacy-posting-owner-transactions.test.ts src/lib/__tests__/portal-invoice-existing-owner-adapter.test.ts
      - name: TypeScript
        run: pnpm --dir artifacts/api-server run typecheck
